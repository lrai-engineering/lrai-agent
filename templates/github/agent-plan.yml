name: Agent plan

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: agent-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    # Replace the actor gate and label with the repository's approved policy.
    if: >-
      github.actor == 'YOUR_GITHUB_LOGIN' &&
      github.event.issue.user.login == 'YOUR_GITHUB_LOGIN' &&
      ((github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'agent:plan')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:plan'))
    runs-on: [self-hosted, lrai-agent]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run LRAI Agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
          SENDER: ${{ github.actor }}
        run: lrai-agent plan
