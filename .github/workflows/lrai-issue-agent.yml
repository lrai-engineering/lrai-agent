name: LRAI issue agent

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: lrai-agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.actor == 'lukasijus' &&
      github.event.issue.user.login == 'lukasijus' &&
      (github.event.action == 'opened' ||
      github.event.label.name == 'codex-plan' ||
      github.event.label.name == 'claude-plan') &&
      ((contains(github.event.issue.labels.*.name, 'codex-plan') &&
      !contains(github.event.issue.labels.*.name, 'claude-plan') &&
      !contains(github.event.issue.labels.*.name, 'codex') &&
      !contains(github.event.issue.labels.*.name, 'claude')) ||
      (contains(github.event.issue.labels.*.name, 'claude-plan') &&
      !contains(github.event.issue.labels.*.name, 'codex-plan') &&
      !contains(github.event.issue.labels.*.name, 'codex') &&
      !contains(github.event.issue.labels.*.name, 'claude')))
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select provider
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if [[ "$LABELS" == *'"codex-plan"'* ]]; then
            provider=codex
            trigger_label=codex-plan
          else
            provider=claude
            trigger_label=claude-plan
          fi
          live_labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          if ! grep -Fxq -- "$trigger_label" <<< "$live_labels"; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label "$trigger_label"
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Acknowledge request
        if: steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --body
          "Started a read-only $PROVIDER planning run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Download issue attachments
        if: steps.agent.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: >-
          lrai-agent fetch-attachments
          --output "$GITHUB_WORKSPACE/.lrai-agent-attachments/manifest.json"

      - name: Generate plan
        if: steps.agent.outputs.active == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
          SENDER: ${{ github.actor }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
        run: >-
          lrai-agent plan --provider "$PROVIDER"
          --attachments "$GITHUB_WORKSPACE/.lrai-agent-attachments/manifest.json"
          --output "$RUNNER_TEMP/lrai-agent-output.md"

      - name: Remove issue attachments
        if: always() && steps.agent.outputs.active == 'true'
        run: rm -rf -- "$GITHUB_WORKSPACE/.lrai-agent-attachments"

      - name: Post plan
        if: steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
          OUTPUT_PATH: ${{ runner.temp }}/lrai-agent-output.md
          COMMENT_PATH: ${{ runner.temp }}/lrai-agent-comment.md
        run: |
          # JavaScript template literals expand in Node, not the shell.
          # shellcheck disable=SC2016
          node -e 'const fs=require("fs"); const text=fs.readFileSync(process.env.OUTPUT_PATH,"utf8"); const body=`## ${process.env.PROVIDER} plan\n\n${text}`; fs.writeFileSync(process.env.COMMENT_PATH,body.slice(0,64000));'
          gh issue comment "$ISSUE_NUMBER" --body-file "$COMMENT_PATH"

      - name: Report failure
        if: failure() && steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --body
          "The planning run failed. Review $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

  implement:
    if: >-
      github.actor == 'lukasijus' &&
      github.event.issue.user.login == 'lukasijus' &&
      (github.event.action == 'opened' ||
      github.event.label.name == 'codex' ||
      github.event.label.name == 'claude') &&
      ((contains(github.event.issue.labels.*.name, 'codex') &&
      !contains(github.event.issue.labels.*.name, 'claude') &&
      !contains(github.event.issue.labels.*.name, 'codex-plan') &&
      !contains(github.event.issue.labels.*.name, 'claude-plan')) ||
      (contains(github.event.issue.labels.*.name, 'claude') &&
      !contains(github.event.issue.labels.*.name, 'codex') &&
      !contains(github.event.issue.labels.*.name, 'codex-plan') &&
      !contains(github.event.issue.labels.*.name, 'claude-plan')))
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select provider and record base
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if [[ "$LABELS" == *'"codex"'* ]]; then
            provider=codex
            trigger_label=codex
          else
            provider=claude
            trigger_label=claude
          fi
          live_labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          if ! grep -Fxq -- "$trigger_label" <<< "$live_labels"; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label "$trigger_label"
          {
            echo "active=true"
            echo "provider=$provider"
            echo "base_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge request
        if: steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --body
          "Started a bounded $PROVIDER implementation run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Download issue attachments
        if: steps.agent.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: >-
          lrai-agent fetch-attachments
          --output "$GITHUB_WORKSPACE/.lrai-agent-attachments/manifest.json"

      - name: Implement issue
        if: steps.agent.outputs.active == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
          SENDER: ${{ github.actor }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
        run: >-
          lrai-agent implement --provider "$PROVIDER"
          --attachments "$GITHUB_WORKSPACE/.lrai-agent-attachments/manifest.json"
          --output "$RUNNER_TEMP/lrai-agent-output.md"

      - name: Remove issue attachments
        if: always() && steps.agent.outputs.active == 'true'
        run: rm -rf -- "$GITHUB_WORKSPACE/.lrai-agent-attachments"

      - name: Enforce workflow boundary
        if: steps.agent.outputs.active == 'true'
        env:
          BASE_SHA: ${{ steps.agent.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -n "$(git status --porcelain)"
          protected_changes=$(git status --porcelain -- \
            .github/workflows \
            .github/actions \
            .lrai-agent.yml \
            AGENTS.md \
            CLAUDE.md)
          if test -n "$protected_changes"; then
            echo "Agent modified protected orchestration files:" >&2
            echo "$protected_changes" >&2
            exit 1
          fi

      - name: Validate changes
        if: steps.agent.outputs.active == 'true'
        run: |
          npm ci
          npm run check

      - name: Prepare credential-free patch
        if: steps.agent.outputs.active == 'true'
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Agent produced no implementation changes." >&2
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/lrai-agent.patch"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.agent.outputs.active == 'true'
        with:
          name: issue-${{ github.event.issue.number }}-${{ steps.agent.outputs.provider }}-patch
          path: ${{ runner.temp }}/lrai-agent.patch
          if-no-files-found: error
          retention-days: 7

      - name: Publish draft pull request
        if: steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PROVIDER: ${{ steps.agent.outputs.provider }}
        run: |
          branch="agent/issue-$ISSUE_NUMBER-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name "lrai-engineering-agent[bot]"
          git config user.email "lrai-engineering-agent[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "issue #$ISSUE_NUMBER: agent implementation"

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git -c core.hooksPath=/dev/null push --set-upstream origin "$branch"

          body=$(printf 'Closes #%s\n\nImplemented by %s through the bounded LRAI issue workflow. Review and merge this draft PR manually.' "$ISSUE_NUMBER" "$PROVIDER")
          pr_url=$(gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$ISSUE_TITLE" --body "$body")
          gh issue comment "$ISSUE_NUMBER" --body "Draft implementation PR: $pr_url"

      - name: Report failure
        if: failure() && steps.agent.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --body
          "The implementation run failed before producing a draft PR. A validated patch artifact may still be available at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
