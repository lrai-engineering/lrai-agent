# Reference configuration. Copy the settings you need to .lrai-agent.yml in a
# consuming repository. Omitted settings use the defaults shown here.
version: 1
provider: codex

# Omit plan.prompt to use the prompt shipped with this package. An explicit
# prompt path is resolved relative to this file.
# plan:
#   prompt: /etc/lrai-agent/prompts/plan.md

# Omit implement.prompt to use the bounded implementation prompt shipped with
# this package. Implementation edits the checkout but never publishes changes.
# implement:
#   prompt: /etc/lrai-agent/prompts/implement.md

providers:
  codex:
    executable: codex
    model: gpt-6-astra
    reasoningEffort: medium

  claude:
    executable: claude
    # model: sonnet

# Repository-owned preview identity. The worker-side deployment policy maps
# this app name to an allowlisted Jetson target; it is not a hostname or shell
# command and cannot select arbitrary infrastructure.
# preview:
#   app: calify

# The plan command is read-only. The implement command confines Codex to its
# workspace-write sandbox and Claude to file tools without Bash or network
# tools. These command policies are invariants and are not configurable.
